# Attentive probe head training config.
# Only the class-attention head (CLS token + class-attention blocks + classifier)
# is trained; the pretrained encoder is frozen throughout. More capacity than the
# linear probe, so a few more epochs — but each epoch is still cheap (frozen encoder,
# no backward through it).

epochs: 20
batch_size: 1000

# Encoder architecture — must match the pretrained checkpoint
embed_dim: 128
num_heads: 8
num_layers: 8
dropout: 0.1
expansion_factor: 4
pair_embed_dims: [64, 64, 64]
ragged_pair_embed: true   # 1M encoders were trained ragged (output-equivalent at eval, but faithful)

# Class-attention head (matches LorentzParT's classification head)
num_cls_layers: 2
hidden_dim: 256
num_mlp_layers: 0

optimizer:
  lr: 0.001
  weight_decay: 0.01

scheduler:
  T_max: 20
  eta_min: 0.00001

num_workers: 8
pin_memory: true
